name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HWLOC_HOME: /usr

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}, JDK ${{ matrix.java }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ubuntu: "24.04", java: 21 }
          - { ubuntu: "22.04", java: 17 }
          - { ubuntu: "22.04", java: 11 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install hwloc
        run: sudo apt-get update && sudo apt-get install -y libhwloc-dev
      # Builds the native library, runs the tests and builds the jar, the sources and the Javadoc
      - name: Build and test
        run: mvn -B clean verify
      # The JNI headers are generated by the build, but they are also in the repository
      - name: Check that the JNI headers of the repository are up to date
        if: matrix.java == 21
        run: git diff --exit-code -- 'src/main/native/*.h'

  # The oldest environment that is supported: hwloc 2.1, Maven 3.6 and a POSIX locale.
  # Java is not installed with apt: the Java packages of this image fail to configure in
  # the containers of GitHub (update-alternatives cannot create /usr/share/binfmts/jar).
  oldest:
    name: Ubuntu 20.04 (hwloc 2.1, Maven 3.6, JDK 11) and Java 8
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the tools
        run: apt-get update && apt-get install -y git gcc make curl ca-certificates libhwloc-dev
      - uses: actions/checkout@v7
      - name: Install Java 8, to run the jar
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
      - name: Remember where Java 8 is
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install JDK 11, to build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
      - name: Install Maven 3.6.3, the oldest that is supported
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.6.3/binaries/apache-maven-3.6.3-bin.tar.gz | tar -xz -C /opt
          echo "/opt/apache-maven-3.6.3/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: mvn -B clean verify
      # The jar is built for Java 8, so it has to run on it
      - name: Run an example with Java 8
        run: '"$JAVA8_HOME/bin/java" -cp "$(ls lib/jhwloc-*.jar)" -Djava.library.path=lib es.udc.gac.jhwloc.examples.HelloWorld'

  licenses:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
